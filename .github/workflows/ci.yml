name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # The build must never embed demo credentials.
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:e2e --workspace @lankadws/api
      - run: npm run build

  web-e2e:
    name: Web end-to-end (desktop Chromium)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    # 20 of 35 browser scenarios already fail on the current code (they lag behind product
    # changes). Report them without blocking the pipeline until they are brought up to date.
    continue-on-error: true
    env:
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --workspace @lankadws/web -- --project=desktop-chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/artifacts/playwright-report
          retention-days: 7
