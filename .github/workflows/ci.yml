name: CI

# One run per push to beta or main. A pull request between them shows the checks of its head
# commit, so there is no separate pull_request run doing the same work twice.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # The build must never embed demo credentials.
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Type-aware lint resolves @lankadws/contracts from its build output.
      - run: npm run build --workspace @lankadws/contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:e2e --workspace @lankadws/api
      - run: npm run build

  web-e2e:
    name: Web end-to-end (desktop and mobile Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Browsers are cached per Playwright version; the system libraries are installed every run.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads from the runner occasionally fail; retry before failing the job.
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - run: npm run test:e2e --workspace @lankadws/web -- --project=desktop-chromium --project=mobile-chromium
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/artifacts/playwright-report
          retention-days: 7
