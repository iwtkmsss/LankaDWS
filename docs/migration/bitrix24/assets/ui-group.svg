<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Макет робочої групи LankaDWS</title><desc id="desc">Group workspace with tabs for feed, tasks, chat, files, calendar and members.</desc>
