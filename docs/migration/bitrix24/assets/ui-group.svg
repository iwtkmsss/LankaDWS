t-size="14">Чат</text><text x="620" y="301" fill="#718096" font-family="Arial" font-size="14">Файли</text><text x="710" y="301" fill="#718096" font-family="Arial" font-size="14">Календар</text><text x="830" y="301" fill="#718096" font-family="Arial" font-size="14">Учасники</text><text x="1245" y="301" fill="#1f5f9b" font-family="Arial" font-size="14">＋ Додати</text><rect x="282" y="349" width="690" height="116" rx="12" fill="#fff" stroke="#d9e2ec"/><circle cx="320" cy="387" r="18" fill="#f1bb76"/><text x="352" y="383" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">Андрій Коваль</text><text x="466" y="383" fill="#8190a3" font-family="Arial" font-size="12">8 хв тому</text><text x="352" y="413" fill="#334e68" font-family="Arial" font-size="14">Фокус-блок готовий до перевірки.</text><text x="352" y="441" fill="#1f5f9b" font-family="Arial" font-size="13">2 коментарі · Відкрити задачу</text><rect x="1000" y="349" width="342" height="260" rx="12" fill="#fff" stroke="#d9e2ec"/><text x="1026" y="388" fill="#12243b" font-family="Arial" font-size="16" font-weight="700">Учасники</text><text x="1026" y="427" fill="#334e68" font-family="Arial" font-size="14">● Марія Іваненко · власник</text><text x="1026" y="460" fill="#334e68" font-family="Arial" font-size="14">● Андрій Коваль · учасник</text><text x="1026" y="493" fill="#334e68" font-family="Arial" font-size="14">● Олена Бондар · учасник</text><text x="1026" y="548" fill="#1f5f9b" font-family="Arial" font-size="13">Переглянути всіх 12 →</text><rect x="282" y="489" width="690" height="120" rx="12" fill="#fff" stroke="#d9e2ec"/><text x="310" y="528" fill="#12243b" font-family="Arial" font-size="15" font-weight="700">Остання активність</text><text x="310" y="560" fill="#718096" font-family="Arial" font-size="13">Задача TSK-2401 перейшла у «На перевірці»</text><text x="310" y="588" fill="#1f5f9b" font-family="Arial" font-size="13">Відкрити · Додати коментар</text></svg>
