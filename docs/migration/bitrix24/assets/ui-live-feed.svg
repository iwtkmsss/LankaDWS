<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Макет Живої стрічки LankaDWS</title>
  <desc id="desc">Desktop wireframe with sidebar, composer, activity feed and attention rail.</desc>
  <rect width="1440" height="900" fill="#f4f7fb"/>
  <rect width="248" height="900" fill="#0c1d33"/>
  <text x="32" y="52" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">LankaDWS</text>
  <text x="32" y="75" fill="#9db2ca" font-family="Arial" font-size="12">CRM workspace</text>
  <rect x="16" y="112" width="216" height="44" rx="10" fill="#1f5f9b"/>
  <text x="34" y="140" fill="#ffffff" font-family="Arial" font-size="15" font-weight="700">▣  Жива стрічка</text>
  <g fill="#c3d2e4" font-family="Arial" font-size="15">
    <text x="34" y="192">✓  Завдання</text><text x="34" y="238">◉  Чат та дзвінки</text>
    <text x="34" y="284">▦  Групи</text><text x="34" y="330">□  Диск</text>
    <text x="34" y="376">◷  Календар</text><text x="34" y="422">◌  Відсутності</text>
    <text x="34" y="468">♙  Співробітники</text><text x="34" y="526">＋  Ще</text>
  </g>
  <line x1="24" y1="760" x2="224" y2="760" stroke="#29405a"/>
  <circle cx="48" cy="812" r="18" fill="#4f8ac4"/><text x="76" y="808" fill="#fff" font-family="Arial" font-size="14">Марія Іваненко</text><text x="76" y="828" fill="#9db2ca" font-family="Arial" font-size="12">Працівник</text>
  <rect x="248" width="1192" height="76" fill="#ffffff"/>
  <text x="282" y="45" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">LankaDWS Україна⌄</text>
  <rect x="520" y="20" width="370" height="36" rx="8" fill="#f2f5f9"/><text x="544" y="43" fill="#8293a8" font-family="Arial" font-size="14">Пошук у LankaDWS</text><text x="844" y="43" fill="#8293a8" font-family="Arial" font-size="12">Ctrl K</text>
  <text x="1130" y="44" fill="#1f5f9b" font-family="Arial" font-size="14">Повідомлення</text><text x="1290" y="44" fill="#1f5f9b" font-family="Arial" font-size="14">Сповіщення 3</text>
  <g>
    <text x="282" y="130" fill="#12243b" font-family="Arial" font-size="28" font-weight="700">Жива стрічка</text>
    <text x="282" y="156" fill="#718096" font-family="Arial" font-size="14">Оновлення, які стосуються вас і ваших робочих груп</text>
    <rect x="282" y="185" width="720" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
    <circle cx="322" cy="226" r="20" fill="#8bb7df"/><text x="358" y="220" fill="#60758d" font-family="Arial" font-size="14">Що потрібно повідомити команді?</text>
    <rect x="358" y="241" width="116" height="34" rx="7" fill="#eaf3fb"/><text x="376" y="263" fill="#1f5f9b" font-family="Arial" font-size="13">＋ Пост</text>
    <rect x="484" y="241" width="126" height="34" rx="7" fill="#eaf3fb"/><text x="502" y="263" fill="#1f5f9b" font-family="Arial" font-size="13">✓ Задача</text>
    <rect x="620" y="241" width="126" height="34" rx="7" fill="#eaf3fb"/><text x="638" y="263" fill="#1f5f9b" font-family="Arial" font-size="13">◷ Подія</text>
    <rect x="756" y="241" width="126" height="34" rx="7" fill="#eaf3fb"/><text x="774" y="263" fill="#1f5f9b" font-family="Arial" font-size="13">□ Файл</text>
    <rect x="282" y="328" width="720" height="52" rx="10" fill="#ffffff" stroke="#d9e2ec"/><text x="304" y="360" fill="#52667d" font-family="Arial" font-size="13">Обране · Важливе · Дата · Тип · Автор · Кому</text><text x="920" y="360" fill="#1f5f9b" font-family="Arial" font-size="13">Скинути</text>
    <g>
      <rect x="282" y="404" width="720" height="172" rx="12" fill="#ffffff" stroke="#d9e2ec"/><circle cx="322" cy="446" r="19" fill="#f1bb76"/><text x="358" y="439" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">Андрій Коваль</text><text x="480" y="439" fill="#8190a3" font-family="Arial" font-size="12">створив задачу · 12 хв тому</text><text x="358" y="467" fill="#334e68" font-family="Arial" font-size="15">Підготувати концепцію дизайну dashboard</text><rect x="358" y="489" width="102" height="24" rx="12" fill="#fff2d9"/><text x="376" y="506" fill="#9c6500" font-family="Arial" font-size="12">У роботі</text><text x="474" y="506" fill="#718096" font-family="Arial" font-size="12">Термін: сьогодні · Дизайн</text><text x="358" y="546" fill="#1f5f9b" font-family="Arial" font-size="13">Відкрити задачу</text>
      <rect x="282" y="594" width="720" height="154" rx="12" fill="#ffffff" stroke="#d9e2ec"/><circle cx="322" cy="636" r="19" fill="#80c7a4"/><text x="358" y="630" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">Олена Бондар</text><text x="480" y="630" fill="#8190a3" font-family="Arial" font-size="12">важливе повідомлення · 1 год тому</text><text x="358" y="659" fill="#334e68" font-family="Arial" font-size="15">Оновлено правила роботи з даними</text><rect x="358" y="681" width="132" height="32" rx="8" fill="#1f5f9b"/><text x="376" y="702" fill="#ffffff" font-family="Arial" font-size="13">Ознайомився</text><text x="510" y="702" fill="#718096" font-family="Arial" font-size="12">Потрібне підтвердження</text>
    </g>
    <rect x="1030" y="185" width="350" height="260" rx="12" fill="#ffffff" stroke="#d9e2ec"/><text x="1056" y="222" fill="#12243b" font-family="Arial" font-size="17" font-weight="700">Моя увага</text><text x="1056" y="250" fill="#718096" font-family="Arial" font-size="13">Тільки дії, які потребують реакції</text><text x="1056" y="292" fill="#d9534f" font-family="Arial" font-size="14">● 2 задачі на сьогодні</text><text x="1056" y="330" fill="#d18b22" font-family="Arial" font-size="13">● 1 повідомлення потребує підтвердження</text><text x="1056" y="368" fill="#1f5f9b" font-family="Arial" font-size="14">● 3 непрочитані чати</text><text x="1056" y="414" fill="#1f5f9b" font-family="Arial" font-size="13">Переглянути все →</text>
    <rect x="1030" y="467" width="350" height="281" rx="12" fill="#eaf3fb"/><text x="1056" y="508" fill="#12243b" font-family="Arial" font-size="17" font-weight="700">Найближче</text><text x="1056" y="540" fill="#52667d" font-family="Arial" font-size="13">Події з календаря у доступних контекстах</text><rect x="1056" y="568" width="290" height="64" rx="8" fill="#ffffff"/><text x="1076" y="592" fill="#718096" font-family="Arial" font-size="12">Сьогодні · 15:00</text><text x="1076" y="614" fill="#12243b" font-family="Arial" font-size="14">Синхронізація команди</text><rect x="1056" y="644" width="290" height="64" rx="8" fill="#ffffff"/><text x="1076" y="668" fill="#718096" font-family="Arial" font-size="12">Завтра · 10:30</text><text x="1076" y="690" fill="#12243b" font-family="Arial" font-size="14">Рев'ю плану міграції</text><text x="1056" y="734" fill="#1f5f9b" font-family="Arial" font-size="13">Відкрити календар →</text>
  </g>
</svg>
