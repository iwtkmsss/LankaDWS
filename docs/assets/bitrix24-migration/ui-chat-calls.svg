<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Макет чату та дзвінків LankaDWS</title><desc id="desc">Inbox with conversations on the left and a contextual conversation with call card on the right.</desc>
  <rect width="1440" height="900" fill="#f4f7fb"/><rect width="248" height="900" fill="#0c1d33"/><text x="32" y="52" fill="#fff" font-family="Arial" font-size="24" font-weight="700">LankaDWS</text><text x="32" y="75" fill="#9db2ca" font-family="Arial" font-size="12">CRM workspace</text><rect x="16" y="204" width="216" height="44" rx="10" fill="#1f5f9b"/><text x="34" y="232" fill="#fff" font-family="Arial" font-size="15" font-weight="700">◉  Чат та дзвінки</text><g fill="#c3d2e4" font-family="Arial" font-size="15"><text x="34" y="140">▣  Жива стрічка</text><text x="34" y="186">✓  Завдання</text><text x="34" y="284">▦  Групи</text><text x="34" y="330">□  Диск</text><text x="34" y="376">◷  Календар</text><text x="34" y="422">◌  Відсутності</text><text x="34" y="468">♙  Співробітники</text><text x="34" y="526">＋  Ще</text></g><rect x="248" width="1192" height="76" fill="#fff"/><text x="282" y="45" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">LankaDWS Україна⌄</text><text x="1130" y="44" fill="#1f5f9b" font-family="Arial" font-size="14">Сповіщення 3</text><text x="282" y="128" fill="#12243b" font-family="Arial" font-size="28" font-weight="700">Чат та дзвінки</text><text x="282" y="154" fill="#718096" font-family="Arial" font-size="14">Діалоги, пошук у повідомленнях і короткі результати дзвінків</text><rect x="282" y="188" width="330" height="568" rx="12" fill="#fff" stroke="#d9e2ec"/><rect x="302" y="210" width="290" height="38" rx="8" fill="#f2f5f9"/><text x="322" y="234" fill="#8293a8" font-family="Arial" font-size="13">Пошук діалогів і повідомлень</text><text x="302" y="286" fill="#1f5f9b" font-family="Arial" font-size="14" font-weight="700">Усі  ·  Непрочитані</text><rect x="302" y="310" width="290" height="76" rx="8" fill="#eaf3fb"/><circle cx="330" cy="340" r="16" fill="#8bb7df"/><text x="358" y="336" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">Дизайн dashboard</text><text x="358" y="360" fill="#52667d" font-family="Arial" font-size="12">Перевірмо фокус-блок…</text><circle cx="570" cy="334" r="8" fill="#d9534f"/><text x="302" y="428" fill="#334e68" font-family="Arial" font-size="14">Компанія</text><text x="302" y="452" fill="#8190a3" font-family="Arial" font-size="12">Загальний чат · 3 нових</text><text x="302" y="506" fill="#334e68" font-family="Arial" font-size="14">Дзвінки</text><text x="302" y="530" fill="#8190a3" font-family="Arial" font-size="12">1 результат сьогодні</text><rect x="640" y="188" width="702" height="568" rx="12" fill="#fff" stroke="#d9e2ec"/><text x="674" y="228" fill="#12243b" font-family="Arial" font-size="18" font-weight="700">Дизайн dashboard</text><text x="674" y="252" fill="#718096" font-family="Arial" font-size="12">Контекст: TSK-2401 · Дизайн продукту</text><text x="1160" y="228" fill="#1f5f9b" font-family="Arial" font-size="12">Сповіщення: згадки⌄</text><line x1="674" y1="274" x2="1308" y2="274" stroke="#e1e8f0"/><circle cx="704" cy="320" r="16" fill="#f1bb76"/><text x="735" y="318" fill="#334e68" font-family="Arial" font-size="14">Андрій: Перевірмо mobile-поведінку перед публікацією.</text><text x="735" y="342" fill="#8190a3" font-family="Arial" font-size="11">09:35</text><circle cx="704" cy="392" r="16" fill="#8bb7df"/><text x="735" y="390" fill="#334e68" font-family="Arial" font-size="14">Марія: Так, додам це до задачі.</text><text x="735" y="414" fill="#8190a3" font-family="Arial" font-size="11">09:42</text><rect x="674" y="450" width="634" height="104" rx="10" fill="#f8fafc" stroke="#d9e2ec"/><text x="698" y="480" fill="#12243b" font-family="Arial" font-size="14" font-weight="700">☎ Результат дзвінка · 18 хв</text><text x="698" y="507" fill="#52667d" font-family="Arial" font-size="13">Учасники: Марія, Андрій · Статус: завершено</text><text x="698" y="532" fill="#52667d" font-family="Arial" font-size="13">Рішення: перевірити mobile перед публікацією</text><text x="1178" y="532" fill="#1f5f9b" font-family="Arial" font-size="13">＋ Створити задачу</text><rect x="674" y="585" width="634" height="62" rx="9" fill="#f2f5f9"/><text x="698" y="622" fill="#8293a8" font-family="Arial" font-size="14">Написати повідомлення…</text><rect x="1192" y="598" width="94" height="36" rx="7" fill="#1f5f9b"/><text x="1214" y="621" fill="#fff" font-family="Arial" font-size="13">Надіслати</text></svg>
